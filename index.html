<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/bulbasaur-64x64.png">
    
  <title>Frontend Mentor | Blog preview card</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap');

    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    .background {
      background-color: hsl(47, 88%, 63%);
    }
    .whitebox { 
      background-color:white;
      border-radius: 20px;
      padding:24px;
      min-width: 327px;
      width: 27%;
      max-width:384px;
      min-height: 501px;
      height:54%;
      box-shadow: 8px 8px;
      border: 1px solid black;
    }
    .learningicon {
      background-color:hsl(47, 88%, 63%);
      font-size: 12px;
      font-weight: 700;
    }
    .illustration {
      background-image: url("assets/images/illustration-article.svg");
      border-radius:10px;
      height:200px;
      min-width: 279px;
      width: 100%;
    }
    .flexcenter { 
      display:flex;
      justify-content: center;
      align-items: center;
      height:100vh;
      width: 100%;
      font-family: "Figtree";
    }
  </style>
</head>
<body class="background">
  <div class="flexcenter">
    <div class="whitebox">
      <div class="illustration"></div>
      Hola
    </div>
  </div>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/matiasmonzonrubano1-beep">Matias Monzon Rubano</a>.
  </div>
</body>
</html>
